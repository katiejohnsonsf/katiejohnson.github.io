<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" style="width:100%;max-width:480px;display:block;margin:2rem auto;">

  <!-- Header -->
  <text x="210" y="22" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b5f55" letter-spacing="2">INFORMED SEATTLE</text>
  <text x="210" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#1e1612">Collective Sensemaking Infrastructure</text>
  <line x1="130" y1="62" x2="290" y2="62" stroke="#e5dcd4" stroke-width="1"/>

  <!-- Step 1: Government creates policy (slate blue) -->
  <rect x="20" y="80" width="360" height="44" rx="5" fill="#dfe8ed" stroke="#8fb5c8" stroke-width="1.5"/>
  <text x="200" y="102" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1a2e38">Government creates policy</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="128" x2="200" y2="140" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,140 204,140 200,148" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 2: Information becomes understandable (warm beige) -->
  <rect x="20" y="148" width="360" height="44" rx="5" fill="#e8e2d8" stroke="#b5a590" stroke-width="1.5"/>
  <text x="200" y="170" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1e1612">Information becomes understandable</text>

  <!-- Arrow 2 -->
  <line x1="200" y1="196" x2="200" y2="208" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,208 204,208 200,216" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 3: Residents develop shared understanding (amber) -->
  <rect x="20" y="216" width="360" height="44" rx="5" fill="#f0e6d8" stroke="#c9a070" stroke-width="1.5"/>
  <text x="200" y="238" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1e1612">Residents develop shared understanding</text>

  <!-- Arrow 3 -->
  <line x1="200" y1="264" x2="200" y2="276" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,276 204,276 200,284" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 4: Residents find one another (amber) -->
  <rect x="20" y="284" width="360" height="44" rx="5" fill="#f0e6d8" stroke="#c9a070" stroke-width="1.5"/>
  <text x="200" y="306" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1e1612">Residents find one another</text>

  <!-- Arrow 4 -->
  <line x1="200" y1="332" x2="200" y2="344" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,344 204,344 200,352" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 5: Collective action becomes possible (terracotta pivot) -->
  <rect x="20" y="352" width="360" height="44" rx="5" fill="#fae3d6" stroke="#c95b2b" stroke-width="2"/>
  <text x="200" y="374" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1e1612">Collective action becomes possible</text>

  <!-- Arrow 5 -->
  <line x1="200" y1="400" x2="200" y2="412" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,412 204,412 200,420" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 6: Institutions receive broader feedback (slate blue, two lines) -->
  <rect x="20" y="420" width="360" height="56" rx="5" fill="#dfe8ed" stroke="#8fb5c8" stroke-width="1.5"/>
  <text x="200" y="441" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1a2e38">Institutions receive broader,</text>
  <text x="200" y="459" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1a2e38">more representative feedback</text>

  <!-- Arrow 6 -->
  <line x1="200" y1="480" x2="200" y2="492" stroke="#c95b2b" stroke-width="2" opacity="0.7"/>
  <polygon points="196,492 204,492 200,500" fill="#c95b2b" opacity="0.7"/>

  <!-- Step 7: Better policy (slate blue, bold) -->
  <rect x="20" y="500" width="360" height="44" rx="5" fill="#dfe8ed" stroke="#8fb5c8" stroke-width="1.5"/>
  <text x="200" y="522" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1a2e38">Better policy</text>

  <!-- Return arc: step 7 right midpoint (380,522) → step 1 right midpoint (380,102) -->
  <path d="M 380,522 C 464,522 464,102 380,102" fill="none" stroke="#c95b2b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
  <!-- Arrowhead at arc end, pointing left into step 1 -->
  <polygon points="380,102 394,95 394,109" fill="#c95b2b" opacity="0.45"/>

  <!-- Rotated label along return arc -->
  <text text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" fill="#6b5f55" opacity="0.65" letter-spacing="1.5" transform="rotate(-90,490,312)">
    <tspan x="490" y="312">THE CYCLE CONTINUES</tspan>
  </text>

</svg>
