  <!-- Labels -->
  <text x="100" y="90" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a7acc">CENSUS</text>
  <text x="100" y="102" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a7acc">Title 13</text>
  <text x="100" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a5aaa">ACS microdata</text>
  <text x="100" y="152" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a5aaa">survey records</text>
  <text x="300" y="90" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aaabb">EHR</text>
