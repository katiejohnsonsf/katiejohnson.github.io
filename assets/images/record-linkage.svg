  <circle cx="270" cy="120" r="75" fill="#1a2e30" stroke="#3a6a6a" stroke-width="1.5" opacity="0.9"/>
  <!-- Overlap zone -->
  <path d="M 190 55 Q 230 80 230 120 Q 230 160 190 185 Q 150 160 150 120 Q 150 80 190 55 Z" fill="#2a3045" opacity="0.6"/>
  <!-- Lock icon in overlap -->
