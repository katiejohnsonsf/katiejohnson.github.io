  <text x="45" y="118" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">RAW</text>
  <text x="45" y="129" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">DATA</text>
  <circle cx="45" cy="152" r="8" fill="#c0392b" opacity="0.8"/>
  <text x="45" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="white">!</text>

  <line x1="75" y1="130" x2="85" y2="130" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#pa)"/>

  <rect x="85" y="70" width="60" height="120" rx="3" fill="#1e2030" stroke="#3a4a6a" stroke-width="1.5"/>
  <text x="115" y="107" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">PROCESS</text>
