  <text x="115" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="white">!</text>

  <line x1="145" y1="130" x2="155" y2="130" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#pa)"/>

  <rect x="155" y="70" width="60" height="120" rx="3" fill="#1e2030" stroke="#3a4a6a" stroke-width="1.5"/>
  <text x="185" y="100" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">ORDER</text>
  <text x="185" y="111" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">TO REPR.</text>
  <text x="185" y="122" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">WORLD</text>
  <circle cx="185" cy="152" r="8" fill="#c0392b" opacity="0.9"/>
  <text x="185" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="white">!</text>

  <line x1="215" y1="130" x2="225" y2="130" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#pa)"/>

  <rect x="225" y="70" width="60" height="120" rx="3" fill="#1e2030" stroke="#3a4a6a" stroke-width="1.5"/>
  <text x="255" y="107" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">MODELS</text>
  <circle cx="255" cy="152" r="8" fill="#e07b54" opacity="0.8"/>
  <text x="255" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="white">!</text>

  <line x1="285" y1="130" x2="295" y2="130" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#pa)"/>

  <rect x="295" y="70" width="90" height="120" rx="3" fill="#1e2030" stroke="#3a4a6a" stroke-width="1.5"/>
