  <text x="340" y="111" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">WITH</text>
  <text x="340" y="122" text-anchor="middle" font-family="monospace" font-size="7" fill="#6a80bb">WORLD</text>
  <circle cx="340" cy="152" r="8" fill="#d4a843" opacity="0.8"/>
  <text x="340" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="white">!</text>

  <!-- Legend -->
  <circle cx="20" cy="220" r="6" fill="#c0392b" opacity="0.9"/>
  <text x="32" y="224" font-family="monospace" font-size="8" fill="#aaa">high gap</text>
  <circle cx="100" cy="220" r="6" fill="#e07b54" opacity="0.9"/>
  <text x="112" y="224" font-family="monospace" font-size="8" fill="#aaa">med gap</text>
