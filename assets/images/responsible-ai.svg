      <path d="M0,0 L5,2.5 L0,5 Z" fill="#4a5a7a"/>
    </marker>
  </defs>
  <!-- 5 stage blocks across -->
  <rect x="15" y="70" width="60" height="120" rx="3" fill="#1e2030" stroke="#3a4a6a" stroke-width="1.5"/>
