<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#1a1a18"/>
  <!-- Pipeline stages -->
  <rect x="20" y="90" width="70" height="80" rx="4" fill="#1e2a1e" stroke="#3a5a3a" stroke-width="1.5"/>
  <text x="55" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#7aaa7a">RAW</text>
  <text x="55" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#7aaa7a">DATA</text>
  <!-- Arrow -->
  <line x1="90" y1="130" x2="115" y2="130" stroke="#5a7a5a" stroke-width="1.5" marker-end="url(#ga)"/>
  <!-- Feature engineering box — INTERVENTION POINT -->
  <rect x="115" y="75" width="90" height="110" rx="4" fill="#2a2a10" stroke="#e07b54" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="monospace" font-size="7" fill="#e07b54">FEATURE</text>
  <text x="160" y="121" text-anchor="middle" font-family="monospace" font-size="7" fill="#e07b54">ENGINEERING</text>
  <!-- Small charts inside -->
  <rect x="125" y="128" width="28" height="18" rx="1" fill="#3a3a18"/>
  <rect x="127" y="138" width="4" height="8" fill="#7aaa4a"/>
  <rect x="133" y="132" width="4" height="14" fill="#e07b54"/>
  <rect x="139" y="135" width="4" height="11" fill="#7aaa4a"/>
  <rect x="145" y="130" width="4" height="16" fill="#e07b54"/>
  <text x="125" y="158" font-family="monospace" font-size="6" fill="#aaa">grp A vs B</text>
  <rect x="160" y="128" width="38" height="18" rx="1" fill="#3a3a18"/>
  <text x="168" y="140" font-family="monospace" font-size="7" fill="#d4a843">lat/lon</text>
  <text x="164" y="150" font-family="monospace" font-size="6" fill="#e07b54">≈ race?</text>
  <!-- Arrow -->
  <line x1="205" y1="130" x2="230" y2="130" stroke="#5a7a5a" stroke-width="1.5" marker-end="url(#ga)"/>
  <!-- Model training box -->
  <rect x="230" y="90" width="70" height="80" rx="4" fill="#1e1e2a" stroke="#3a3a6a" stroke-width="1.5"/>
  <text x="265" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a7acc">MODEL</text>
  <text x="265" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a7acc">TRAIN</text>
  <!-- Arrow -->
  <line x1="300" y1="130" x2="325" y2="130" stroke="#5a7a5a" stroke-width="1.5" marker-end="url(#ga)"/>
  <!-- Output box -->
  <rect x="325" y="90" width="55" height="80" rx="4" fill="#2a1a1a" stroke="#7a3a3a" stroke-width="1.5"/>
  <text x="352" y="122" text-anchor="middle" font-family="monospace" font-size="7" fill="#aa5a5a">PRED-</text>
  <text x="352" y="133" text-anchor="middle" font-family="monospace" font-size="7" fill="#aa5a5a">ICTION</text>
  <!-- Intervention arrow -->
  <path d="M 160 75 L 160 55 L 20 55 L 20 88" stroke="#e07b54" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ra)"/>
  <text x="30" y="50" font-family="monospace" font-size="8" fill="#e07b54">← intervene here, not here →</text>
  <path d="M 352 90 L 352 55 L 380 55" stroke="#aa5a5a" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <defs>
    <marker id="ga" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a7a5a"/>
    </marker>
    <marker id="ra" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e07b54"/>
    </marker>
  </defs>
  <text x="20" y="248" font-family="monospace" font-size="9" fill="#4a4a30">RESPONSIBLE FEATURE ENGINEERING FRAMEWORK</text>
</svg>
